[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rossmann"
version = "1.0.0"
description = "Rossmann store sales forecasting: promo and holiday effects, per-store vs global models"
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]
